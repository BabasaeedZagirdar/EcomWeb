
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
                min-height: 100vh;
                background:radial-gradient(circle at center, #7f5af0, #16161a 55%, #010101 100%)
            
            }

        
        .form-area{
         margin-top: 24px;
         border: 1px solid black;
         height: 500px;
         width: 400px;
         box-shadow: 10px 15px 20px;
         border-radius: 20px;
         padding-left: 20px;
        }
.form-badge{
    display: inline-flex;
    align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(55, 65, 81, 0.7);
      color: #e5e7eb;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 12px;
}
.badge-dot{
    width:5px;
    height: 5px;
    border-radius: 10px;
    background-color: greenyellow;
}
h1{
color: white;
}
p{
color: gray;
a{
    color: aqua;
}}

label{
    display: flex;
    justify-content:space-between;
    align-items: center;
      font-size: 12px;
      color: #e5e7eb;
      margin:10px;
      font-weight: 500;
}
input {
      width: 90%;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.6);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.7), 0 0 0 7px rgba(129, 140, 248, 0.16);
      background: rgba(15, 23, 42, 0.95);
    }
    .hint{
        font-size: small;
        padding-left:8px;
    }
    button{
        width: 50%;
      border-radius: 10px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background-color: white;
      color: #080808;
      font-size: 13px;
      outline: none;
      transition:width 0.5s,background-color 3s;
      padding: 10px 11px;
    }
    button:hover{
        background-color:#f8f8f8;
        
        width: 90%;
    }
    </style>
</head>
<body>
    <section class="form-area">
        <div class="form-badge">
<span class="badge-dot"></span>
<span>GET STARTED IN MINUTES</span>
        </div>
        <h1>Create Your Account</h1>
        <p>Already have an Account?<a href="#">Sign-up</a></p>
        

<form action="index.html">
    <label for="username">First name</label>
    <input type="text" name="username" placeholder="Enter your first name">
    <label for="Last name">Last name</label>
    <input type="text" name="username" placeholder="Enter your last name">
    <label for="email">Email</label>
    <input type="text" name="email" placeholder="Enter your email">
    <label for="password">Password</label>
    <input type="text" name="password" placeholder="Enter your password">
    <p class="hint">Use atleast 8 character combinations</p>
    <center><button type="submit">Create Account</button></center>
</form>


</section>

</body>
</html>
